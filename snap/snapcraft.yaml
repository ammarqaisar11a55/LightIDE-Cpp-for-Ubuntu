name: lightide
base: core24
adopt-info: lightide
summary: Lightweight C/C++ IDE, a modern Dev-C++ alternative
description: |
  LightIDE is a fast, native C and C++ IDE. Open a .cpp file, press F11 and type
  into your running program, with no project to create.

  It includes a QScintilla editor, clickable compiler errors, an interactive
  program console, GDB debugging, multi-file projects, and built-in support for
  solving LeetCode problems locally.

  LightIDE uses the GCC, G++ and GDB installed on your system:

    sudo apt install build-essential gdb
website: https://github.com/ammarqaisar11a55/LightIDE-Cpp-for-Ubuntu
source-code: https://github.com/ammarqaisar11a55/LightIDE-Cpp-for-Ubuntu
issues: https://github.com/ammarqaisar11a55/LightIDE-Cpp-for-Ubuntu/issues
grade: stable

# An IDE has to run the host's compiler and debugger on the user's own files, and
# then run the programs they produce. Strict confinement rules all of that out.
confinement: classic

platforms:
  amd64:

apps:
  lightide:
    command: usr/bin/lightide
    desktop: usr/share/applications/lightide.desktop
    environment:
      QT_PLUGIN_PATH: $SNAP/usr/lib/x86_64-linux-gnu/qt6/plugins

parts:
  lightide:
    plugin: cmake
    source: .
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DLIGHTIDE_BUILD_TESTS=OFF
    build-packages:
      - g++
      - ninja-build
      - patchelf
      - qt6-base-dev
      - qt6-svg-dev
      - libqscintilla2-qt6-dev
    stage-packages:
      - libqscintilla2-qt6-15
      - libqt6network6t64
      - libqt6svg6
      - libqt6widgets6t64
      - qt6-qpa-plugins
      - qt6-wayland
    # These arrive as package dependencies and are most of the snap's size, but
    # widgets are drawn in software, and only the Wayland client side is used.
    prime:
      - -usr/lib/*/dri
      - -usr/lib/*/libEGL_mesa*
      - -usr/lib/*/libGLX_mesa*
      - -usr/lib/*/libLLVM*
      - -usr/lib/*/libQt6Qml*
      - -usr/lib/*/libQt6Quick*
      - -usr/lib/*/libQt6WaylandCompositor*
      - -usr/lib/*/libQt6WaylandEglCompositor*
      - -usr/lib/*/libgallium*
      - -usr/lib/*/libicuio*
      - -usr/lib/*/libicutest*
      - -usr/lib/*/qt6/plugins/wayland-graphics-integration-server
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)"
    # Every bundled binary is pointed at the snap's libraries and core24's loader.
    # LD_LIBRARY_PATH would do this too, but the compiler, GDB and the user's own
    # programs would inherit it and load the wrong libraries.
    override-prime: |
      craftctl default
      runpath=/snap/lightide/current/usr/lib/x86_64-linux-gnu
      runpath=$runpath:/snap/lightide/current/usr/lib/x86_64-linux-gnu/libproxy
      runpath=$runpath:/snap/core24/current/usr/lib/x86_64-linux-gnu
      find usr -type f | while read -r file; do
        patchelf --print-rpath "$file" > /dev/null 2>&1 || continue
        chmod u+w "$file"
        patchelf --set-rpath "$runpath" "$file"
        if patchelf --print-interpreter "$file" > /dev/null 2>&1; then
          patchelf --set-interpreter /snap/core24/current/lib64/ld-linux-x86-64.so.2 "$file"
        fi
      done
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/lightide.svg|' \
        usr/share/applications/lightide.desktop
